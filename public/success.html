<!DOCTYPE html>
<html lang="az">

<head>

    <script defer src="https://umami.tiktok-panel.xyz/script.js" data-website-id="350f90e9-946e-4d6e-8980-8f768edc4481"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uğurlu Ödəniş</title>

    <link rel="shortcut icon" href="/imgs/logo.png" type="image/x-icon">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">

    <!-- RemixIcon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
        integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- CSS link -->
    <link rel="stylesheet" href="/css/style.css">

    <link rel="canonical" href="https://tiktok-panel.xyz/success" />


    <meta name="google-site-verification" content="6a0UStkZHtcP5GR8XJv52o2gIi5h4lAzpbdSE4afi4U" />
    <meta name="msvalidate.01" content="16B13A896FAD3CC5AB0384ED4B6024C9" />

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #fff5f7, #f0f2f5);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .animate-check {
            animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">

    <section class="max-w-xl w-full">
        <div
            class="glass-card p-8 md:p-12 rounded-[2.5rem] shadow-2xl shadow-purple-100/50 text-center relative overflow-hidden">

            <div class="absolute -top-10 -right-10 w-32 h-32 bg-purple-100 rounded-full blur-3xl opacity-50"></div>
            <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-blue-100 rounded-full blur-3xl opacity-50"></div>

            <div class="relative z-10">
                <div
                    class="animate-check mb-8 inline-flex items-center justify-center w-24 h-24 rounded-full bg-purple-600 text-white shadow-lg shadow-purple-200">
                    <i class="ri-check-double-line ri-3x"></i>
                </div>

                <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-4 tracking-tight">
                    Ödəniş <span class="text-purple-600">Uğurludur</span>
                </h1>

                <p class="text-gray-500 text-base md:text-lg mb-10 leading-relaxed">
                    Bizi seçdiyiniz üçün təşəkkür edirik! Sifarişiniz uğurla tamamlandı və ən qısa zamanda işlənməyə
                    başlayacaq.
                </p>

                <div id="diagnostics" class="mt-6 p-4 rounded-xl border border-gray-100 bg-white/50 hidden">
                    <div class="flex items-center gap-3">
                        <div id="status-icon" class="w-10 h-10 rounded-full flex items-center justify-center">
                            <i class="ri-loader-4-line animate-spin"></i>
                        </div>
                        <div>
                            <h4 id="status-title" class="font-bold text-gray-800">Sifariş yoxlanılır...</h4>
                            <p id="status-desc" class="text-sm text-gray-500">Məlumatlar emal edilir.</p>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-4">
                    <a href="mailto:support@tiktok-panel.com"
                        class="flex-1 flex items-center justify-center gap-2 bg-gray-900 text-white py-4 px-6 rounded-2xl font-bold hover:bg-black transition-all transform hover:-translate-y-1 shadow-xl shadow-gray-200">
                        <i class="ri-mail-line ri-lg text-blue-400"></i>
                        Dəstək
                    </a>

                    <a href="/"
                        class="flex-1 flex items-center justify-center gap-2 bg-white text-gray-700 py-4 px-6 rounded-2xl font-bold border border-gray-200 hover:bg-gray-50 transition-all transform hover:-translate-y-1">
                        <i class="ri-home-smile-2-line ri-lg text-purple-500"></i>
                        Geri Dön
                    </a>
                </div>
            </div>
        </div>

        <p class="text-center text-gray-400 mt-8 text-sm">
            © 2026 Tiktok-Panel.xyz — Bütün hüquqlar qorunur.
        </p>
    </section>


    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const internalId = urlParams.get('internal_id');

        if (internalId) {
            if (!sessionStorage.getItem('processed_' + internalId)) {
                fetch('/api/finalize-after-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ internal_id: internalId })
                }).catch(err => console.error("Səssiz xəta:", err));

                sessionStorage.setItem('processed_' + internalId, 'true');
            }

            // Müştərini gözlətmədən 3 saniyə ərzində yönləndir
            setTimeout(() => { window.location.href = "/"; }, 3000);
        } else {
            window.location.href = "/";
        }
    </script>
</body>

</html>
